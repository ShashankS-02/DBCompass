services:
  billing-db:
    image: container-registry.oracle.com/database/enterprise:19.3.0.0
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
    ports:
      - "1521:1521"
  billing-service:
    build: .
    environment:
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD}
    depends_on:
      - billing-db
