services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
  api:
    build: ./src/ClaimsHub
    environment:
      ConnectionStrings__Claims: ${CLAIMS_CONNECTION_STRING}
    depends_on:
      - sqlserver
