# Per-engine feature checklist for the guided intake (M8).
#
# Each engine lists the engine-specific features an application might depend on. `feature` is the
# catalog value stored in data.special_features (questions.yaml); `label` is the engine's own name
# for it. `how_to_check` is a catalog / dictionary query that returns METADATA ONLY (object names,
# counts, settings): it never reads table rows, so it is safe to run and to paste the result into a
# ticket. Teams run these themselves; DBCompass never connects to a database.
#
# `discovery` (M11) lists general metadata queries per engine (version, size, load), shown in Help.
#
# python -m app.knowledge.check verifies that every `feature` is an option of data.special_features.
version: 1
last_verified: 2026-11-13

# Features that make staying on the same engine materially easier (rules.yaml R-FEAT-STICKY-001).
sticky_features: [advanced_queuing, clr_or_java, flashback, scheduler_jobs, replication, rac, db_links, sql_agent_jobs]

engines:
  oracle:
    discovery_note: "DBA_FEATURE_USAGE_STATISTICS lists every licensed option the database has ever used; start there."
    discovery:
      - {label: "Version", query: "SELECT banner FROM v$version;"}
      - {label: "Database size (GB)", query: "SELECT ROUND(SUM(bytes)/1024/1024/1024, 1) AS size_gb FROM dba_segments;"}
      - {label: "20 largest tables", query: "SELECT owner, segment_name, ROUND(SUM(bytes)/1024/1024/1024, 2) AS size_gb FROM dba_segments WHERE segment_type LIKE 'TABLE%' GROUP BY owner, segment_name ORDER BY size_gb DESC FETCH FIRST 20 ROWS ONLY;"}
      - {label: "Character set", query: "SELECT value FROM nls_database_parameters WHERE parameter = 'NLS_CHARACTERSET';"}
      - {label: "Current load (transactions per second)", query: "SELECT metric_name, ROUND(value, 1) AS value FROM v$sysmetric WHERE metric_name IN ('User Transaction Per Sec', 'Executions Per Sec') AND group_id = 2;", note: "Run at peak time. DBA_HIST_* views give history but need the Diagnostics Pack licence."}
      - {label: "User sessions", query: "SELECT COUNT(*) AS user_sessions FROM v$session WHERE type = 'USER';"}
      - {label: "PL/SQL code objects", query: "SELECT owner, object_type, COUNT(*) FROM dba_objects WHERE object_type IN ('PACKAGE BODY', 'PROCEDURE', 'FUNCTION', 'TRIGGER') AND owner NOT IN ('SYS', 'SYSTEM') GROUP BY owner, object_type ORDER BY owner;"}
    features:
      - {feature: rac, label: "RAC (Real Application Clusters)", how_to_check: "SELECT name, value FROM v$parameter WHERE name = 'cluster_database';"}
      - {feature: partitioning, label: "Partitioning", how_to_check: "SELECT COUNT(*) FROM dba_part_tables WHERE owner NOT IN ('SYS','SYSTEM');"}
      - {feature: db_links, label: "Database links", how_to_check: "SELECT owner, db_link, host FROM dba_db_links;"}
      - {feature: materialized_views, label: "Materialized views", how_to_check: "SELECT owner, mview_name, refresh_method FROM dba_mviews;"}
      - {feature: advanced_queuing, label: "Advanced Queuing (AQ)", how_to_check: "SELECT owner, name, queue_type FROM dba_queues WHERE owner NOT IN ('SYS','SYSTEM');"}
      - {feature: scheduler_jobs, label: "DBMS_SCHEDULER / DBMS_JOB jobs", how_to_check: "SELECT owner, job_name, enabled FROM dba_scheduler_jobs WHERE owner NOT IN ('SYS','SYSTEM');"}
      - {feature: clr_or_java, label: "Java stored procedures", how_to_check: "SELECT owner, COUNT(*) FROM dba_objects WHERE object_type LIKE 'JAVA%' GROUP BY owner;"}
      - {feature: flashback, label: "Flashback (Data Archive, Flashback Query)", how_to_check: "SELECT name, detected_usages FROM dba_feature_usage_statistics WHERE name LIKE 'Flashback%';"}
      - {feature: replication, label: "GoldenGate / Streams / Data Guard replication", how_to_check: "SELECT name, detected_usages FROM dba_feature_usage_statistics WHERE name IN ('GoldenGate','Data Guard','Active Data Guard');"}
      - {feature: spatial, label: "Spatial / Locator", how_to_check: "SELECT COUNT(*) FROM dba_sdo_geom_metadata;"}
      - {feature: in_db_full_text, label: "Oracle Text", how_to_check: "SELECT owner, index_name FROM dba_indexes WHERE ityp_owner = 'CTXSYS';"}
      - {feature: hierarchical_queries, label: "CONNECT BY hierarchical queries", how_to_check: "SELECT COUNT(*) FROM dba_source WHERE UPPER(text) LIKE '%CONNECT BY%' AND owner NOT IN ('SYS','SYSTEM');"}
      - {feature: sequences, label: "Sequences", how_to_check: "SELECT sequence_owner, COUNT(*) FROM dba_sequences GROUP BY sequence_owner;"}
      - {feature: compression, label: "Advanced Compression / HCC", how_to_check: "SELECT name, detected_usages FROM dba_feature_usage_statistics WHERE name LIKE '%Compression%';"}
      - {feature: tde, label: "Transparent Data Encryption", how_to_check: "SELECT * FROM v$encryption_wallet;"}
      - {feature: xml_data, label: "XMLType columns", how_to_check: "SELECT owner, table_name FROM dba_tab_columns WHERE data_type = 'XMLTYPE';"}
      - {feature: external_tables, label: "External tables / Data Pump directories", how_to_check: "SELECT owner, table_name FROM dba_external_tables;"}

  sql_server:
    discovery_note: "Run these against each user database; msdb holds Agent jobs and SSIS packages."
    discovery:
      - {label: "Version and edition", query: "SELECT @@VERSION AS version, SERVERPROPERTY('Edition') AS edition;"}
      - {label: "Database sizes (GB)", query: "SELECT DB_NAME(database_id) AS database_name, CAST(SUM(size) * 8 / 1024.0 / 1024 AS DECIMAL(10, 2)) AS size_gb FROM sys.master_files GROUP BY database_id;"}
      - {label: "20 largest tables", query: "SELECT TOP 20 s.name AS schema_name, t.name AS table_name, SUM(a.total_pages) * 8 / 1024 AS size_mb FROM sys.tables t JOIN sys.schemas s ON t.schema_id = s.schema_id JOIN sys.partitions p ON t.object_id = p.object_id JOIN sys.allocation_units a ON p.partition_id = a.container_id GROUP BY s.name, t.name ORDER BY size_mb DESC;"}
      - {label: "Collation", query: "SELECT SERVERPROPERTY('Collation') AS server_collation;"}
      - {label: "Current load (batch requests)", query: "SELECT cntr_value FROM sys.dm_os_performance_counters WHERE counter_name = 'Batch Requests/sec';", note: "The counter is cumulative: run it twice, 60 seconds apart, and divide the difference by 60."}
      - {label: "User sessions", query: "SELECT COUNT(*) AS user_sessions FROM sys.dm_exec_sessions WHERE is_user_process = 1;"}
      - {label: "T-SQL code objects", query: "SELECT type_desc, COUNT(*) FROM sys.objects WHERE type IN ('P', 'FN', 'IF', 'TF', 'TR') GROUP BY type_desc;", note: "Run in each user database."}
    features:
      - {feature: sql_agent_jobs, label: "SQL Server Agent jobs", how_to_check: "SELECT name, enabled FROM msdb.dbo.sysjobs;"}
      - {feature: db_links, label: "Linked servers", how_to_check: "SELECT name, product, data_source FROM sys.servers WHERE is_linked = 1;"}
      - {feature: partitioning, label: "Table partitioning", how_to_check: "SELECT name FROM sys.partition_schemes;"}
      - {feature: rac, label: "Always On availability groups / failover cluster", how_to_check: "SELECT name FROM sys.availability_groups; SELECT SERVERPROPERTY('IsClustered');"}
      - {feature: clr_or_java, label: "CLR assemblies", how_to_check: "SELECT name, permission_set_desc FROM sys.assemblies WHERE is_user_defined = 1;"}
      - {feature: advanced_queuing, label: "Service Broker", how_to_check: "SELECT name, is_broker_enabled FROM sys.databases WHERE is_broker_enabled = 1;"}
      - {feature: in_db_full_text, label: "Full-text search", how_to_check: "SELECT OBJECT_NAME(object_id) FROM sys.fulltext_indexes;"}
      - {feature: replication, label: "Replication (transactional / merge) or log shipping", how_to_check: "SELECT name FROM sys.databases WHERE is_published = 1 OR is_subscribed = 1 OR is_merge_published = 1;"}
      - {feature: flashback, label: "Temporal tables / CDC", how_to_check: "SELECT name FROM sys.tables WHERE temporal_type = 2; SELECT name FROM sys.databases WHERE is_cdc_enabled = 1;"}
      - {feature: tde, label: "Transparent Data Encryption", how_to_check: "SELECT DB_NAME(database_id), encryption_state FROM sys.dm_database_encryption_keys;"}
      - {feature: xml_data, label: "XML columns / XML indexes", how_to_check: "SELECT OBJECT_NAME(object_id), name FROM sys.xml_indexes;"}
      - {feature: spatial, label: "Spatial types (geometry / geography)", how_to_check: "SELECT OBJECT_NAME(object_id), name FROM sys.columns WHERE system_type_id IN (240) ;"}
      - {feature: compression, label: "Row / page compression or columnstore", how_to_check: "SELECT DISTINCT data_compression_desc FROM sys.partitions WHERE data_compression > 0;"}
      - {feature: external_tables, label: "PolyBase external tables / SSIS packages", how_to_check: "SELECT name FROM sys.external_tables; SELECT name FROM SSISDB.catalog.projects;"}
      - {feature: sequences, label: "Sequences / IDENTITY", how_to_check: "SELECT name FROM sys.sequences;"}
      - {feature: materialized_views, label: "Indexed views", how_to_check: "SELECT OBJECT_NAME(object_id) FROM sys.indexes WHERE index_id = 1 AND OBJECTPROPERTY(object_id, 'IsView') = 1;"}

  postgresql:
    discovery_note: "Extensions are the main portability question; managed services allow only a fixed list."
    discovery:
      - {label: "Version", query: "SELECT version();"}
      - {label: "Database size", query: "SELECT pg_size_pretty(pg_database_size(current_database()));"}
      - {label: "20 largest tables", query: "SELECT relname, pg_size_pretty(pg_total_relation_size(relid)) AS total_size FROM pg_catalog.pg_statio_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 20;"}
      - {label: "Encoding", query: "SHOW server_encoding;"}
      - {label: "Current load (transactions)", query: "SELECT xact_commit + xact_rollback AS transactions FROM pg_stat_database WHERE datname = current_database();", note: "The count is cumulative: run it twice, 60 seconds apart, and divide the difference by 60."}
      - {label: "Client connections", query: "SELECT COUNT(*) AS connections FROM pg_stat_activity WHERE backend_type = 'client backend';"}
      - {label: "Installed extensions", query: "SELECT extname, extversion FROM pg_extension;", note: "Managed services allow only a fixed list of extensions; compare with the target's list."}
      - {label: "Functions and procedures", query: "SELECT n.nspname AS schema_name, COUNT(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname NOT IN ('pg_catalog', 'information_schema') GROUP BY n.nspname;"}
    features:
      - {feature: extensions, label: "Extensions (pg_cron, PostGIS, pg_partman, …)", how_to_check: "SELECT extname, extversion FROM pg_extension;"}
      - {feature: partitioning, label: "Declarative partitioning", how_to_check: "SELECT COUNT(*) FROM pg_partitioned_table;"}
      - {feature: db_links, label: "Foreign data wrappers / dblink", how_to_check: "SELECT srvname, fdwname FROM pg_foreign_server s JOIN pg_foreign_data_wrapper f ON s.srvfdw = f.oid;"}
      - {feature: replication, label: "Logical / streaming replication", how_to_check: "SELECT pubname FROM pg_publication; SELECT subname FROM pg_subscription; SELECT * FROM pg_replication_slots;"}
      - {feature: materialized_views, label: "Materialized views", how_to_check: "SELECT schemaname, matviewname FROM pg_matviews;"}
      - {feature: scheduler_jobs, label: "pg_cron jobs", how_to_check: "SELECT jobname, schedule FROM cron.job;"}
      - {feature: clr_or_java, label: "Untrusted languages (plpython, plperlu, C functions)", how_to_check: "SELECT lanname FROM pg_language WHERE lanpltrusted = false;"}
      - {feature: spatial, label: "PostGIS", how_to_check: "SELECT extversion FROM pg_extension WHERE extname = 'postgis';"}
      - {feature: in_db_full_text, label: "Full-text search (tsvector / GIN)", how_to_check: "SELECT COUNT(*) FROM pg_attribute a JOIN pg_type t ON a.atttypid = t.oid WHERE t.typname = 'tsvector';"}
      - {feature: sequences, label: "Sequences", how_to_check: "SELECT COUNT(*) FROM pg_sequences;"}
      - {feature: external_tables, label: "Large objects (pg_largeobject)", how_to_check: "SELECT COUNT(DISTINCT loid) FROM pg_largeobject;"}

  mysql:
    discovery_note: "Also covers MariaDB; check storage engines other than InnoDB."
    discovery:
      - {label: "Version", query: "SELECT VERSION();"}
      - {label: "Schema sizes (GB)", query: "SELECT table_schema, ROUND(SUM(data_length + index_length) / 1024 / 1024 / 1024, 2) AS size_gb FROM information_schema.tables GROUP BY table_schema;"}
      - {label: "20 largest tables", query: "SELECT table_schema, table_name, ROUND((data_length + index_length) / 1024 / 1024, 1) AS size_mb FROM information_schema.tables ORDER BY (data_length + index_length) DESC LIMIT 20;"}
      - {label: "Character set and collation", query: "SELECT @@character_set_server, @@collation_server;"}
      - {label: "Current load (queries)", query: "SHOW GLOBAL STATUS LIKE 'Questions';", note: "The count is cumulative: run it twice, 60 seconds apart, and divide the difference by 60."}
      - {label: "Connected sessions", query: "SHOW GLOBAL STATUS LIKE 'Threads_connected';"}
      - {label: "Stored routines", query: "SELECT routine_schema, routine_type, COUNT(*) FROM information_schema.routines GROUP BY routine_schema, routine_type;"}
    features:
      - {feature: partitioning, label: "Partitioned tables", how_to_check: "SELECT DISTINCT table_schema, table_name FROM information_schema.partitions WHERE partition_name IS NOT NULL;"}
      - {feature: scheduler_jobs, label: "Event Scheduler events", how_to_check: "SELECT event_schema, event_name, status FROM information_schema.events;"}
      - {feature: replication, label: "Replication (binlog) / Group Replication", how_to_check: "SHOW REPLICA STATUS; SELECT * FROM performance_schema.replication_group_members;"}
      - {feature: in_db_full_text, label: "FULLTEXT indexes", how_to_check: "SELECT DISTINCT table_schema, table_name FROM information_schema.statistics WHERE index_type = 'FULLTEXT';"}
      - {feature: spatial, label: "Spatial types / indexes", how_to_check: "SELECT DISTINCT table_schema, table_name FROM information_schema.statistics WHERE index_type = 'SPATIAL';"}
      - {feature: clr_or_java, label: "User-defined functions (UDF plugins)", how_to_check: "SELECT name, dl FROM mysql.func;"}
      - {feature: external_tables, label: "Non-InnoDB storage engines (MyISAM, FEDERATED, …)", how_to_check: "SELECT engine, COUNT(*) FROM information_schema.tables WHERE table_schema NOT IN ('mysql','sys','information_schema','performance_schema') GROUP BY engine;"}
      - {feature: tde, label: "Keyring / tablespace encryption", how_to_check: "SELECT tablespace_name FROM information_schema.innodb_tablespaces WHERE encryption = 'Y';"}

  mariadb:
    discovery_note: "Same checks as MySQL; Galera and ColumnStore are MariaDB-specific."
    features:
      - {feature: partitioning, label: "Partitioned tables", how_to_check: "SELECT DISTINCT table_schema, table_name FROM information_schema.partitions WHERE partition_name IS NOT NULL;"}
      - {feature: scheduler_jobs, label: "Event Scheduler events", how_to_check: "SELECT event_schema, event_name, status FROM information_schema.events;"}
      - {feature: replication, label: "Galera cluster / replication", how_to_check: "SHOW STATUS LIKE 'wsrep_cluster_size'; SHOW REPLICA STATUS;"}
      - {feature: external_tables, label: "ColumnStore / Spider / CONNECT engines", how_to_check: "SELECT engine, COUNT(*) FROM information_schema.tables WHERE table_schema NOT IN ('mysql','sys','information_schema','performance_schema') GROUP BY engine;"}
      - {feature: in_db_full_text, label: "FULLTEXT indexes", how_to_check: "SELECT DISTINCT table_schema, table_name FROM information_schema.statistics WHERE index_type = 'FULLTEXT';"}

  db2:
    discovery_note: "Db2 LUW catalog views (SYSCAT); pureScale and federation are the big portability items."
    discovery:
      - {label: "Version", query: "SELECT service_level FROM TABLE(sysproc.env_get_inst_info());"}
      - {label: "Database size", query: "CALL GET_DBSIZE_INFO(?, ?, ?, -1);"}
      - {label: "20 largest tables", query: "SELECT tabschema, tabname, (data_object_p_size + index_object_p_size) / 1024 AS size_mb FROM sysibmadm.admintabinfo ORDER BY size_mb DESC FETCH FIRST 20 ROWS ONLY;"}
      - {label: "Code set", query: "db2 get db cfg for <database> | grep -i \"code set\"", note: "Command line, not SQL."}
      - {label: "Connections", query: "SELECT COUNT(*) AS connections FROM TABLE(MON_GET_CONNECTION(NULL, -2));"}
      - {label: "Routines (SQL PL)", query: "SELECT routineschema, routinetype, COUNT(*) FROM syscat.routines WHERE routineschema NOT LIKE 'SYS%' GROUP BY routineschema, routinetype;"}
    features:
      - {feature: rac, label: "pureScale / HADR", how_to_check: "db2 get db cfg for <db> | grep -i hadr; db2pd -d <db> -cfinfo"}
      - {feature: partitioning, label: "Range partitioning / DPF", how_to_check: "SELECT tabschema, tabname FROM syscat.datapartitions GROUP BY tabschema, tabname;"}
      - {feature: db_links, label: "Federation (nicknames / servers)", how_to_check: "SELECT servername, servertype FROM syscat.servers;"}
      - {feature: materialized_views, label: "Materialized query tables (MQT)", how_to_check: "SELECT tabschema, tabname FROM syscat.tables WHERE type = 'S';"}
      - {feature: scheduler_jobs, label: "Administrative Task Scheduler", how_to_check: "SELECT name, enabled FROM systools.admin_task_list;"}
      - {feature: clr_or_java, label: "Java / C external routines", how_to_check: "SELECT routineschema, routinename, language FROM syscat.routines WHERE language IN ('JAVA','C');"}
      - {feature: replication, label: "Q Replication / SQL Replication / CDC", how_to_check: "SELECT COUNT(*) FROM asn.ibmsnap_register;"}
      - {feature: xml_data, label: "pureXML columns", how_to_check: "SELECT tabschema, tabname, colname FROM syscat.columns WHERE typename = 'XML';"}
      - {feature: compression, label: "Adaptive compression / BLU column-organised tables", how_to_check: "SELECT tabschema, tabname FROM syscat.tables WHERE compression <> 'N' OR tableorg = 'C';"}
      - {feature: sequences, label: "Sequences / identity columns", how_to_check: "SELECT seqschema, seqname FROM syscat.sequences WHERE seqschema NOT LIKE 'SYS%';"}

  mongodb:
    discovery_note: "Run from mongosh; sharding, change streams and Atlas-only features decide the target."
    discovery:
      - {label: "Version", query: "db.version()"}
      - {label: "Database size (GB)", query: "db.stats(1024 * 1024 * 1024)", note: "dataSize is the data, storageSize what it uses on disk."}
      - {label: "20 largest collections", query: "db.getCollectionNames().map(name => ({ name, bytes: db.getCollection(name).stats().storageSize })).sort((a, b) => b.bytes - a.bytes).slice(0, 20)"}
      - {label: "Current load (operations)", query: "db.serverStatus().opcounters", note: "Cumulative: run twice, 60 seconds apart, and divide the difference by 60."}
      - {label: "Connections", query: "db.serverStatus().connections"}
      - {label: "Indexes per collection", query: "db.getCollectionNames().map(name => ({ name, indexes: db.getCollection(name).getIndexes().length }))"}
    features:
      - {feature: sharding, label: "Sharded cluster", how_to_check: "sh.status()"}
      - {feature: replication, label: "Replica set topology", how_to_check: "rs.conf().members.map(m => ({host: m.host, priority: m.priority}))"}
      - {feature: change_streams, label: "Change streams consumers", how_to_check: "db.currentOp({'command.pipeline.0.$changeStream': {$exists: true}})"}
      - {feature: in_db_full_text, label: "Text indexes / Atlas Search", how_to_check: "db.getCollectionNames().flatMap(c => db[c].getIndexes().filter(i => Object.values(i.key).includes('text')).map(i => c + ':' + i.name))"}
      - {feature: spatial, label: "2dsphere geospatial indexes", how_to_check: "db.getCollectionNames().flatMap(c => db[c].getIndexes().filter(i => Object.values(i.key).includes('2dsphere')).map(i => c + ':' + i.name))"}
      - {feature: ttl_expiry, label: "TTL indexes", how_to_check: "db.getCollectionNames().flatMap(c => db[c].getIndexes().filter(i => 'expireAfterSeconds' in i).map(i => c + ':' + i.name))"}
      - {feature: time_series, label: "Time-series collections", how_to_check: "db.getCollectionInfos({type: 'timeseries'}).map(c => c.name)"}
      - {feature: tde, label: "Encryption at rest / client-side field level encryption", how_to_check: "db.serverStatus().encryptionAtRest"}
      - {feature: scheduler_jobs, label: "Atlas triggers / scheduled functions", how_to_check: "Atlas UI → App Services → Triggers (no shell equivalent)"}

  cassandra:
    discovery_note: "Use cqlsh; materialised views and SASI indexes are the portability risks on managed services."
    discovery:
      - {label: "Version", query: "nodetool version", note: "Command line on a node."}
      - {label: "Cluster nodes and data per node", query: "nodetool status"}
      - {label: "Table sizes", query: "nodetool tablestats <keyspace>", note: "Space used (live) is the size per table."}
      - {label: "Keyspaces and replication", query: "SELECT keyspace_name, replication FROM system_schema.keyspaces;"}
      - {label: "Current load (thread pools)", query: "nodetool tpstats"}
      - {label: "Client connections", query: "nodetool clientstats"}
    features:
      - {feature: replication, label: "Multi-datacentre replication", how_to_check: "SELECT keyspace_name, replication FROM system_schema.keyspaces;"}
      - {feature: materialized_views, label: "Materialized views", how_to_check: "SELECT keyspace_name, view_name FROM system_schema.views;"}
      - {feature: secondary_indexes, label: "Secondary / SASI indexes", how_to_check: "SELECT keyspace_name, table_name, index_name, kind FROM system_schema.indexes;"}
      - {feature: clr_or_java, label: "User-defined functions / aggregates", how_to_check: "SELECT keyspace_name, function_name FROM system_schema.functions;"}
      - {feature: ttl_expiry, label: "Default TTL on tables", how_to_check: "SELECT keyspace_name, table_name, default_time_to_live FROM system_schema.tables WHERE default_time_to_live > 0 ALLOW FILTERING;"}
      - {feature: compression, label: "Table compression settings", how_to_check: "SELECT keyspace_name, table_name, compression FROM system_schema.tables;"}
      - {feature: change_streams, label: "CDC enabled tables", how_to_check: "SELECT keyspace_name, table_name FROM system_schema.tables WHERE cdc = true ALLOW FILTERING;"}

  couchbase:
    discovery_note: "Use the REST API or Query Workbench; XDCR, Eventing and FTS have no direct equivalents on CSP services."
    discovery:
      - {label: "Version and cluster", query: "curl -u <admin> http://<host>:8091/pools", note: "REST call; implementationVersion is the server version."}
      - {label: "Buckets and disk used", query: "curl -u <admin> http://<host>:8091/pools/default/buckets", note: "basicStats.diskUsed and itemCount per bucket."}
      - {label: "Keyspaces (collections)", query: "SELECT RAW name FROM system:keyspaces;", note: "Query service (SQL++)."}
      - {label: "Indexes", query: "SELECT name, keyspace_id, state FROM system:indexes;"}
      - {label: "Current load (operations)", query: "curl -u <admin> http://<host>:8091/pools/default/buckets/<bucket>/stats", note: "ops is operations per second, sampled by the server."}
    features:
      - {feature: replication, label: "XDCR replication", how_to_check: "curl -u <user> http://<node>:8091/pools/default/remoteClusters"}
      - {feature: in_db_full_text, label: "Full Text Search indexes", how_to_check: "curl -u <user> http://<node>:8094/api/index"}
      - {feature: secondary_indexes, label: "GSI indexes (N1QL)", how_to_check: "SELECT name, keyspace_id, index_key FROM system:indexes;"}
      - {feature: scheduler_jobs, label: "Eventing functions", how_to_check: "curl -u <user> http://<node>:8096/api/v1/functions"}
      - {feature: ttl_expiry, label: "Document expiry (TTL)", how_to_check: "SELECT name, maxTTL FROM system:keyspaces;"}
      - {feature: spatial, label: "Geospatial FTS queries", how_to_check: "Inspect FTS index definitions for geopoint fields (curl :8094/api/index)"}
      - {feature: xml_data, label: "Analytics service datasets", how_to_check: "curl -u <user> http://<node>:8095/analytics/service -d 'SELECT DatasetName FROM Metadata.`Dataset`'"}

  sybase:
    discovery_note: "SAP ASE: stored procedures and replication server are the usual blockers."
    discovery:
      - {label: "Version", query: "SELECT @@version"}
      - {label: "Database sizes", query: "sp_helpdb"}
      - {label: "Sort order and character set", query: "sp_helpsort"}
      - {label: "User connections", query: "SELECT COUNT(*) FROM master..sysprocesses WHERE suid > 0"}
      - {label: "Procedures and triggers", query: "SELECT type, COUNT(*) FROM sysobjects WHERE type IN ('P', 'TR') GROUP BY type", note: "Run in each user database."}
    features:
      - {feature: db_links, label: "Remote servers / proxy tables", how_to_check: "sp_helpserver; SELECT name FROM sysobjects WHERE type = 'U' AND sysstat2 & 1024 = 1024;"}
      - {feature: replication, label: "Replication Server", how_to_check: "sp_helpdb; sp_config_rep_agent <db>"}
      - {feature: partitioning, label: "Semantic partitioning", how_to_check: "SELECT name FROM sysobjects WHERE type = 'U' AND partitiontype > 0;"}
      - {feature: scheduler_jobs, label: "Job Scheduler jobs", how_to_check: "sp_sjobhelp"}
      - {feature: clr_or_java, label: "Java in the database", how_to_check: "sp_configure 'enable java'"}
      - {feature: tde, label: "Encrypted columns", how_to_check: "sp_encryption helpcol"}
      - {feature: in_db_full_text, label: "Enhanced Full-Text Search", how_to_check: "sp_helpindex on text columns; check EFTS server with sp_helpserver"}

  informix:
    discovery_note: "Enterprise Replication and HDR are the main topology questions; datablades are the feature question."
    discovery:
      - {label: "Version", query: "SELECT DBINFO('version', 'full') FROM systables WHERE tabid = 1;"}
      - {label: "Dbspaces and space used", query: "onstat -d", note: "Command line on the server."}
      - {label: "20 largest tables (by row count)", query: "SELECT FIRST 20 tabname, nrows FROM systables WHERE tabid > 99 AND tabtype = 'T' ORDER BY nrows DESC;", note: "nrows comes from UPDATE STATISTICS; refresh it first."}
      - {label: "Sessions", query: "onstat -g ses", note: "Command line on the server."}
    features:
      - {feature: rac, label: "HDR / RSS / SDS secondaries", how_to_check: "onstat -g dri; onstat -g rss"}
      - {feature: replication, label: "Enterprise Replication (ER)", how_to_check: "cdr list server"}
      - {feature: partitioning, label: "Fragmented tables", how_to_check: "SELECT DISTINCT tabid FROM sysfragments WHERE fragtype = 'T';"}
      - {feature: clr_or_java, label: "DataBlades / C or Java UDRs", how_to_check: "SELECT bldname FROM sysbldobjects; SELECT procname, langid FROM sysprocedures WHERE langid > 0;"}
      - {feature: time_series, label: "TimeSeries DataBlade", how_to_check: "SELECT bldname FROM sysbldobjects WHERE bldname LIKE 'TimeSeries%';"}
      - {feature: spatial, label: "Spatial DataBlade", how_to_check: "SELECT bldname FROM sysbldobjects WHERE bldname LIKE 'spatial%';"}
      - {feature: db_links, label: "Distributed queries (database@server)", how_to_check: "SELECT * FROM sysdistcookies; check application SQL for @server references"}
      - {feature: scheduler_jobs, label: "Scheduler tasks (ph_task)", how_to_check: "SELECT tk_name, tk_enable FROM sysadmin:ph_task;"}
      - {feature: compression, label: "Compressed tables", how_to_check: "SELECT tabname FROM systables t JOIN sysfragments f ON t.tabid = f.tabid WHERE f.flags & 0x200000 > 0;"}

  vertica:
    discovery_note: "Projections and flex tables have no equivalent on cloud warehouses; list them before choosing a target."
    discovery:
      - {label: "Version", query: "SELECT version();"}
      - {label: "Storage used (GB)", query: "SELECT SUM(used_bytes) / 1024 ^ 3 AS used_gb FROM v_monitor.projection_storage;"}
      - {label: "20 largest tables", query: "SELECT anchor_table_schema, anchor_table_name, SUM(used_bytes) / 1024 ^ 3 AS used_gb FROM v_monitor.projection_storage GROUP BY 1, 2 ORDER BY 3 DESC LIMIT 20;"}
      - {label: "Nodes", query: "SELECT node_name, node_state FROM v_catalog.nodes;"}
      - {label: "Sessions", query: "SELECT COUNT(*) FROM v_monitor.sessions;"}
    features:
      - {feature: materialized_views, label: "Projections (non-superprojection)", how_to_check: "SELECT anchor_table_name, projection_name FROM v_catalog.projections WHERE is_super_projection = false;"}
      - {feature: partitioning, label: "Partitioned tables", how_to_check: "SELECT table_schema, table_name, partition_expression FROM v_catalog.tables WHERE partition_expression <> '';"}
      - {feature: xml_data, label: "Flex tables (semi-structured)", how_to_check: "SELECT table_schema, table_name FROM v_catalog.tables WHERE is_flextable;"}
      - {feature: clr_or_java, label: "User-defined extensions (UDx)", how_to_check: "SELECT schema_name, function_name, procedure_type FROM v_catalog.user_functions WHERE procedure_type <> 'User Defined Function';"}
      - {feature: external_tables, label: "External tables (S3 / HDFS / Parquet)", how_to_check: "SELECT table_schema, table_name FROM v_catalog.tables WHERE table_definition <> '';"}
      - {feature: scheduler_jobs, label: "Scheduled jobs (Kafka scheduler, vbr)", how_to_check: "SELECT * FROM v_catalog.scheduled_jobs;"}
      - {feature: in_db_full_text, label: "Text indexes", how_to_check: "SELECT * FROM v_catalog.text_indexes;"}
