# How to find each service's prices in the CSP price lists, and how to turn them into monthly cost.
# Prices themselves are never written here: `python -m app.pricing.snapshot <csp>` reads the official
# price lists and writes knowledge_base/price_snapshots/<csp>.json (see docs/05 "Pricing").
version: 1
last_verified: 2026-11-07

default_geo: india          # pricing geography when neither residency nor user regions say otherwise
snapshot_regions:           # one region per geography; the snapshot builder fetches these
  aws: [ap-south-1, eu-west-1, us-east-1, ap-southeast-1]
  azure: [centralindia, westeurope, eastus, southeastasia]
  gcp: [asia-south1, europe-west1, us-central1, asia-southeast1]

hours_per_month: 730
seconds_per_month: 2628000
storage_months_ahead: 12    # provision storage for current size + 12 months of growth
minimum_storage_gb: 20
average_to_peak_tps: 0.4    # used when wl.avg_tps is not given (request-priced services)
cosmos_ru_per_read: 1       # 1 KB point read
cosmos_ru_per_write: 5      # 1 KB write with default indexing
budget_margin: 1.5          # doc 05: drop options whose Budget tier exceeds cap × margin

# Extra bill components (M9, docs/05 "What the estimate covers"). Assumptions the DBA team can tune:
backup_daily_change_fraction: 0.02   # 2% of the data changes a day -> backup growth per retained day
io_per_transaction: 3                # storage I/O requests per transaction (Aurora Standard I/O billing)
audit_kb_per_transaction: 0.5        # audit record size per transaction (database auditing to the CSP log service)
private_endpoints_per_environment: 2 # one private endpoint per AZ / subnet in each environment

# CSP-wide components shared by every service on that cloud. Found in the official price lists by
# the same matchers as service components; stored in the snapshot under "<csp>.shared".
shared_components:
  aws:
    egress:
      kind: egress
      basis: gb_transfer
      matcher:
        source: AWSDataTransfer
        tier: first_paid
        equals: {To Location: External, Transfer Type: AWS Outbound}
        regex: {usageType: "(^|-)DataTransfer-Out-Bytes$"}
    private_endpoint:
      kind: private_endpoint
      basis: endpoint_hour
      matcher:
        source: AmazonVPC
        equals: {Product Family: VpcEndpoint}
        regex: {usageType: "(^|-)VpcEndpoint-Hours$"}
    kms_key:
      kind: kms_key
      basis: key_month
      matcher:
        source: awskms
        equals: {Product Family: Encryption Key}
        regex: {usageType: "(^|-)KMS-Keys$"}
    audit_logs:
      kind: audit_logs
      basis: gb_ingested
      matcher:
        source: AmazonCloudWatch
        equals: {Product Family: Data Payload}
        regex: {usageType: "(^|-)DataProcessing-Bytes$", PriceDescription: "Standard log class"}
  azure:
    egress:
      kind: egress
      basis: gb_transfer
      matcher:
        source: Bandwidth
        equals: {productName: "Bandwidth - Routing Preference: Internet", meterName: Standard Data Transfer Out, tierMinimumUnits: "100.0"}
    private_endpoint:
      kind: private_endpoint
      basis: endpoint_hour
      matcher:
        source: Virtual Network
        region: Global
        equals: {productName: Virtual Network Private Link, meterName: Standard Private Endpoint}
    kms_key:
      kind: kms_key
      basis: key_month
      matcher:
        source: Key Vault
        equals: {productName: Key Vault, skuName: Premium, meterName: Premium HSM-protected RSA 2048-bit key}
    audit_logs:
      kind: audit_logs
      basis: gb_ingested
      matcher:
        source: Log Analytics
        equals: {productName: Log Analytics, meterName: Analytics Logs Data Ingestion}
  gcp:
    # Not yet in the GCP snapshot: the catalog needs credentials (OPEN_QUESTIONS #62). Descriptions
    # follow the Cloud Billing catalog naming and are verified when the snapshot is rebuilt.
    egress:
      kind: egress
      basis: gb_transfer
      matcher:
        source: Compute Engine
        regex: {description: "^Network Internet Standard Tier Egress from "}
    private_endpoint:
      kind: private_endpoint
      basis: endpoint_hour
      matcher:
        source: Compute Engine
        regex: {description: "^Private Service Connect Consumer Endpoint"}
    kms_key:
      kind: kms_key
      basis: key_month
      matcher:
        source: Cloud Key Management Service (KMS)
        regex: {description: "^Active software key versions"}
    audit_logs:
      kind: audit_logs
      basis: gb_ingested
      matcher:
        source: Cloud Logging
        regex: {description: "^Log Volume"}

# app.env option -> share of production cost. DR counts only when the HA layout has no DR replica.
environment_multipliers: {prod: 1.0, dr: 1.0, uat: 0.5, dev: 0.25}

# cost.commitment answer -> terms that may be used. Unanswered = on_demand only.
terms_allowed:
  on_demand: [on_demand]
  1_year: [on_demand, 1yr]
  3_year: [on_demand, 1yr, 3yr]

# doc 05 §5. A tier uses its preferred term when allowed, else the longest allowed shorter one.
tiers:
  budget: {label: Budget, headroom_fraction: 0.0, size_steps_up: 0, extra_replicas: 0, preferred_term: 3yr, storage: cheapest}
  balanced: {label: Balanced, headroom_fraction: null, size_steps_up: 0, extra_replicas: 0, preferred_term: 1yr, storage: cheapest}
  performance: {label: Performance, headroom_fraction: null, size_steps_up: 1, extra_replicas: 1, preferred_term: on_demand, storage: fastest}

# multi_az_rate: how standby / HA is billed
#   deployment_option     – AWS RDS: the Multi-AZ rate already includes the standby
#   extra_node            – standby billed as another node at the same rate
#   zone_redundancy_addon – Azure SQL: add the "Zone Redundancy" meter
#   included              – serverless / request-priced: HA is in the unit price
services:
  # ---------------- AWS ----------------
  aws.rds_postgresql: &rds
    multi_az_rate: deployment_option
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Instance, Database Engine: PostgreSQL, License Model: No license required}
          regex: {Deployment Option: "^(Single-AZ|Multi-AZ)$", usageType: "(InstanceUsage|Multi-AZUsage|MirrorUsage):db"}
          dims: {instance: Instance Type, deployment: Deployment Option}
      - kind: storage
        basis: gb_month
        applies_to_storage: [gp3]
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage, Volume Type: General Purpose-GP3}
          regex: {Database Engine: "^(PostgreSQL|Any)$", Deployment Option: "^(Single-AZ|Multi-AZ)$"}
          dims: {deployment: Deployment Option}
      - kind: storage
        basis: gb_month
        applies_to_storage: [io2]
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage, Volume Type: Provisioned IOPS-IO2}
          regex: {Database Engine: "^(PostgreSQL|Any)$", Deployment Option: "^(Single-AZ|Multi-AZ)$"}
          dims: {deployment: Deployment Option}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: AmazonRDS
          equals: {Product Family: Storage Snapshot, Database Engine: PostgreSQL}
          regex: {usageType: "(^|-)RDS:ChargedBackupUsage$"}
      - kind: io
        basis: iops_month
        included_iops: 3000
        matcher:
          source: AmazonRDS
          equals: {Product Family: Provisioned IOPS}
          regex: {Database Engine: "^(PostgreSQL|Any)$", usageType: "(^|-)RDS:GP3-PIOPS$"}
      - kind: proxy
        basis: vcpu_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: RDSProxy}
          regex: {Database Engine: "^(PostgreSQL|Any)$", usageType: "(^|-)RDS:ProxyUsage$"}
    note: "Provisioned IOPS above the gp3 baseline and backup beyond the free allowance are not included."
  aws.rds_mysql:
    multi_az_rate: deployment_option
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Instance, Database Engine: MySQL, License Model: No license required}
          regex: {Deployment Option: "^(Single-AZ|Multi-AZ)$", usageType: "(InstanceUsage|Multi-AZUsage|MirrorUsage):db"}
          dims: {instance: Instance Type, deployment: Deployment Option}
      - kind: storage
        basis: gb_month
        applies_to_storage: [gp3]
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage, Volume Type: General Purpose-GP3}
          regex: {Database Engine: "^(MySQL|Any)$", Deployment Option: "^(Single-AZ|Multi-AZ)$"}
          dims: {deployment: Deployment Option}
      - kind: storage
        basis: gb_month
        applies_to_storage: [io2]
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage, Volume Type: Provisioned IOPS-IO2}
          regex: {Database Engine: "^(MySQL|Any)$", Deployment Option: "^(Single-AZ|Multi-AZ)$"}
          dims: {deployment: Deployment Option}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: AmazonRDS
          equals: {Product Family: Storage Snapshot, Database Engine: MySQL}
          regex: {usageType: "(^|-)RDS:ChargedBackupUsage$"}
      - kind: io
        basis: iops_month
        included_iops: 3000
        matcher:
          source: AmazonRDS
          equals: {Product Family: Provisioned IOPS}
          regex: {Database Engine: "^(MySQL|Any)$", usageType: "(^|-)RDS:GP3-PIOPS$"}
      - kind: proxy
        basis: vcpu_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: RDSProxy}
          regex: {Database Engine: "^(MySQL|Any)$", usageType: "(^|-)RDS:ProxyUsage$"}
    note: "Provisioned IOPS above the gp3 baseline and backup beyond the free allowance are not included."
  aws.rds_oracle:
    multi_az_rate: deployment_option
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Instance, Database Engine: Oracle, Database Edition: Enterprise, License Model: Bring your own license}
          regex: {Deployment Option: "^(Single-AZ|Multi-AZ)$", usageType: "(InstanceUsage|Multi-AZUsage|MirrorUsage):db"}
          dims: {instance: Instance Type, deployment: Deployment Option}
      - kind: storage
        basis: gb_month
        applies_to_storage: [gp3]
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage, Volume Type: General Purpose-GP3}
          regex: {Database Engine: "^(Oracle|Any)$", Deployment Option: "^(Single-AZ|Multi-AZ)$"}
          dims: {deployment: Deployment Option}
      - kind: storage
        basis: gb_month
        applies_to_storage: [io2]
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage, Volume Type: Provisioned IOPS-IO2}
          regex: {Database Engine: "^(Oracle|Any)$", Deployment Option: "^(Single-AZ|Multi-AZ)$"}
          dims: {deployment: Deployment Option}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: AmazonRDS
          equals: {Product Family: Storage Snapshot, Database Engine: Oracle}
          regex: {usageType: "(^|-)RDS:ChargedBackupUsage$"}
      - kind: io
        basis: iops_month
        included_iops: 3000
        matcher:
          source: AmazonRDS
          equals: {Product Family: Provisioned IOPS}
          regex: {Database Engine: "^(Oracle|Any)$", usageType: "(^|-)RDS:GP3-PIOPS$"}
    note: "Oracle Enterprise Edition on BYOL: Oracle licence and support costs are NOT included."
  aws.rds_sqlserver:
    multi_az_rate: deployment_option
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Instance, Database Engine: SQL Server, Database Edition: Standard, License Model: License included}
          regex: {Deployment Option: "^(Single-AZ|Multi-AZ)$", usageType: "(InstanceUsage|Multi-AZUsage|MirrorUsage):db"}
          dims: {instance: Instance Type, deployment: Deployment Option}
      - kind: storage
        basis: gb_month
        applies_to_storage: [gp3]
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage, Volume Type: General Purpose-GP3}
          regex: {Database Engine: "^(SQL Server|Any)$", Deployment Option: "^(Single-AZ|Multi-AZ)$"}
          dims: {deployment: Deployment Option}
      - kind: storage
        basis: gb_month
        applies_to_storage: [io2]
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage, Volume Type: Provisioned IOPS-IO2}
          regex: {Database Engine: "^(SQL Server|Any)$", Deployment Option: "^(Single-AZ|Multi-AZ)$"}
          dims: {deployment: Deployment Option}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: AmazonRDS
          equals: {Product Family: Storage Snapshot, Database Engine: SQL Server}
          regex: {usageType: "(^|-)RDS:ChargedBackupUsage$"}
      - kind: io
        basis: iops_month
        included_iops: 3000
        matcher:
          source: AmazonRDS
          equals: {Product Family: Provisioned IOPS}
          regex: {Database Engine: "^(SQL Server|Any)$", usageType: "(^|-)RDS:GP3-PIOPS$"}
      - kind: proxy
        basis: vcpu_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: RDSProxy}
          regex: {Database Engine: "^(SQL Server|Any)$", usageType: "(^|-)RDS:ProxyUsage$"}
    note: "SQL Server Standard Edition, licence included."
  aws.aurora_postgresql:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Instance, Database Engine: Aurora PostgreSQL}
          regex: {usageType: "(^|-)InstanceUsage:db"}
          dims: {instance: Instance Type}
      - kind: storage
        basis: gb_month
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage}
          regex: {Database Engine: "^(Aurora PostgreSQL|Any)$", usageType: "(^|-)Aurora:StorageUsage$"}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: AmazonRDS
          equals: {Product Family: Storage Snapshot, Database Engine: Aurora PostgreSQL}
          regex: {usageType: "(^|-)Aurora:BackupUsage$"}
      - kind: io
        basis: io_request
        matcher:
          source: AmazonRDS
          equals: {Product Family: System Operation}
          regex: {Database Engine: "^(Aurora PostgreSQL|Any)$", usageType: "(^|-)Aurora:StorageIOUsage$"}
      - kind: proxy
        basis: vcpu_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: RDSProxy}
          regex: {Database Engine: "^(Aurora PostgreSQL|Any)$", usageType: "(^|-)RDS:ProxyUsage$"}
    note: "Aurora Standard; I/O requests are billed separately and not included."
  aws.aurora_mysql:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Instance, Database Engine: Aurora MySQL}
          regex: {usageType: "(^|-)InstanceUsage:db"}
          dims: {instance: Instance Type}
      - kind: storage
        basis: gb_month
        matcher:
          source: AmazonRDS
          equals: {Product Family: Database Storage}
          regex: {Database Engine: "^(Aurora MySQL|Any)$", usageType: "(^|-)Aurora:StorageUsage$"}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: AmazonRDS
          equals: {Product Family: Storage Snapshot, Database Engine: Aurora MySQL}
          regex: {usageType: "(^|-)Aurora:BackupUsage$"}
      - kind: io
        basis: io_request
        matcher:
          source: AmazonRDS
          equals: {Product Family: System Operation}
          regex: {Database Engine: "^(Aurora MySQL|Any)$", usageType: "(^|-)Aurora:StorageIOUsage$"}
      - kind: proxy
        basis: vcpu_hour
        matcher:
          source: AmazonRDS
          equals: {Product Family: RDSProxy}
          regex: {Database Engine: "^(Aurora MySQL|Any)$", usageType: "(^|-)RDS:ProxyUsage$"}
    note: "Aurora Standard; I/O requests are billed separately and not included."
  aws.elasticache:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonElastiCache
          equals: {Product Family: Cache Instance, Cache Engine: Valkey}
          regex: {usageType: "(^|-)NodeUsage:cache\\."}
          dims: {instance: Instance Type}
  aws.memorydb:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonMemoryDB
          equals: {Product Family: Amazon MemoryDB}
          regex: {usageType: "(^|-)NodeUsage:db\\.[^:]+:Valkey$"}
          dims: {instance: Instance Type}
  aws.documentdb:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonDocDB
          equals: {Product Family: Database Instance}
          regex: {usageType: "(^|-)InstanceUsage:db\\."}
          dims: {instance: Instance Type}
      - kind: storage
        basis: gb_month
        matcher:
          source: AmazonDocDB
          equals: {Product Family: Database Storage}
          regex: {usageType: "(^|-)StorageUsage$"}
          exclude: {usageType: [Elastic, IOOptimized]}
    note: "Standard storage; I/O requests are billed separately and not included."
  aws.opensearch:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonES
          equals: {Product Family: Amazon OpenSearch Service Instance}
          regex: {usageType: "(^|-)ESInstance:"}
          dims: {instance: Instance Type}
      - kind: storage
        basis: gb_month
        matcher:
          source: AmazonES
          equals: {Product Family: Amazon OpenSearch Service Volume}
          regex: {usageType: "(^|-)ES:GP3-Storage$"}
  aws.redshift:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonRedshift
          equals: {Product Family: Compute Instance}
          regex: {usageType: "(^|-)Node:ra3\\."}
          dims: {instance: Instance Type}
      - kind: storage
        basis: gb_month
        matcher:
          source: AmazonRedshift
          equals: {Product Family: Redshift Managed Storage}
          regex: {usageType: "(^|-)RMS:ra3\\.xlplus$"}
  aws.keyspaces:
    multi_az_rate: included
    components:
      - kind: reads
        basis: read_request_unit
        matcher:
          source: AmazonMCS
          regex: {usageType: "(^|-)ReadRequestUnits$"}
      - kind: writes
        basis: write_request_unit
        matcher:
          source: AmazonMCS
          regex: {usageType: "(^|-)WriteRequestUnits$"}
      - kind: storage
        basis: gb_month
        matcher:
          source: AmazonMCS
          regex: {usageType: "(^|-)TimedStorage-ByteHrs$"}
    note: "On-demand capacity; multi-region replication is not included."
  aws.ec2_self_managed:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: AmazonEC2
          equals: {Product Family: Compute Instance, Operating System: Linux, Tenancy: Shared, Pre Installed S/W: NA, CapacityStatus: Used, License Model: No License required}
          dims: {instance: Instance Type}
      - kind: storage
        basis: gb_month
        applies_to_storage: [gp3]
        matcher:
          source: AmazonEC2
          equals: {Product Family: Storage, Volume API Name: gp3}
      - kind: storage
        basis: gb_month
        applies_to_storage: [io2_block_express]
        matcher:
          source: AmazonEC2
          equals: {Product Family: Storage, Volume API Name: io2}
    note: "Linux compute and EBS only; database licences (e.g. Oracle) and DBA effort are not included."

  # ---------------- Azure ----------------
  azure.postgresql_flexible:
    multi_az_rate: extra_node
    pooling: built_in   # PgBouncer is built into Flexible Server
    components:
      - kind: compute
        basis: vcpu_hour
        applies_to_family: [Dds_v5]
        matcher:
          source: Azure Database for PostgreSQL
          equals: {productName: Azure Database for PostgreSQL Flexible Server General Purpose Ddsv5 Series Compute, skuName: vCore}
      - kind: compute
        basis: vcpu_hour
        applies_to_family: [Eds_v5]
        matcher:
          source: Azure Database for PostgreSQL
          equals: {productName: Azure Database for PostgreSQL Flexible Server Memory Optimized Edsv5 Series Compute, skuName: vCore}
      - kind: compute
        basis: instance_hour
        applies_to_family: [B]
        matcher:
          source: Azure Database for PostgreSQL
          equals: {productName: Azure Database for PostgreSQL Flexible Server Burstable BS Series Compute}
          regex: {skuName: "^(?P<instance>B\\d+m?s)$"}
      - kind: storage
        basis: gb_month
        applies_to_storage: [premium_ssd]
        matcher:
          source: Azure Database for PostgreSQL
          equals: {productName: Azure Database for PostgreSQL Flex Server Storage, skuName: Storage}
      - kind: storage
        basis: gb_month
        applies_to_storage: [premium_ssd_v2]
        matcher:
          source: Azure Database for PostgreSQL
          equals: {productName: Azure Database for PostgreSQL Flex Server Storage, skuName: Premium SSD v2 Storage}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: Azure Database for PostgreSQL
          equals: {productName: Azure Database for PostgreSQL Flexible Server Backup Storage, meterName: Backup Storage LRS Data Stored}
  azure.mysql_flexible:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: vcpu_hour
        applies_to_family: [Ddsv5]
        matcher:
          source: Azure Database for MySQL
          equals: {productName: Azure Database for MySQL Flexible Server General Purpose Ddsv5 Series Compute, skuName: 1 vCore}
      - kind: compute
        basis: instance_hour
        applies_to_family: [Edsv5]
        matcher:
          source: Azure Database for MySQL
          equals: {productName: Azure Database for MySQL Flexible Server Memory Optimized Edsv5 Series Compute}
          regex: {skuName: "^Standard_E(?P<vcpu>\\d+)d_v5$"}
      - kind: compute
        basis: instance_hour
        applies_to_family: [B]
        matcher:
          source: Azure Database for MySQL
          equals: {productName: Azure Database for MySQL Flexible Server Burstable BS Series Compute}
          regex: {skuName: "^Standard_(?P<instance>B\\d+m?s)$"}
      - kind: storage
        basis: gb_month
        matcher:
          source: Azure Database for MySQL
          equals: {productName: Azure Database for MySQL Flexible Server Storage}
          regex: {meterName: "^Storage Data Stored$"}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: Azure Database for MySQL
          equals: {productName: Azure Database for MySQL Flexible Server Backup Storage, meterName: Backup Storage LRS Data Stored}
  azure.sql_database:
    multi_az_rate: zone_redundancy_addon
    components:
      - kind: compute
        basis: instance_hour
        applies_to_family: [general_purpose]
        matcher:
          source: SQL Database
          equals: {productName: SQL Database Single/Elastic Pool General Purpose - Compute Gen5, meterName: vCore}
          regex: {skuName: "^(?P<vcpu>\\d+) vCore$"}
      - kind: zone_redundancy
        basis: instance_hour
        applies_to_family: [general_purpose]
        matcher:
          source: SQL Database
          equals: {productName: SQL Database Single/Elastic Pool General Purpose - Compute Gen5}
          regex: {skuName: "^(?P<vcpu>\\d+) vCore Zone Redundancy$"}
      - kind: compute
        basis: instance_hour
        applies_to_family: [business_critical]
        matcher:
          source: SQL Database
          equals: {productName: SQL Database Single/Elastic Pool Business Critical - Compute Gen5, meterName: vCore}
          regex: {skuName: "^(?P<vcpu>\\d+) vCore$"}
      - kind: storage
        basis: gb_month
        matcher:
          source: SQL Database
          equals: {productName: SQL Database Single/Elastic Pool General Purpose - Storage}
          regex: {meterName: "Data Stored$"}
          exclude: {meterName: [Zone]}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: SQL Database
          equals: {productName: SQL Database Single/Elastic Pool PITR Backup Storage, meterName: LRS Data Stored}
    note: "vCore model, SQL licence included."
  azure.sql_managed_instance:
    multi_az_rate: zone_redundancy_addon
    components:
      - kind: compute
        basis: instance_hour
        applies_to_family: [general_purpose, next_gen_general_purpose]
        matcher:
          source: SQL Managed Instance
          equals: {productName: SQL Managed Instance General Purpose - Compute Gen5, meterName: vCore}
          regex: {skuName: "^(?P<vcpu>\\d+) vCore$"}
      - kind: zone_redundancy
        basis: instance_hour
        applies_to_family: [general_purpose, next_gen_general_purpose]
        matcher:
          source: SQL Managed Instance
          equals: {productName: SQL Managed Instance General Purpose - Compute Gen5}
          regex: {skuName: "^(?P<vcpu>\\d+) vCore Zone Redundancy$"}
      - kind: compute
        basis: instance_hour
        applies_to_family: [business_critical]
        matcher:
          source: SQL Managed Instance
          equals: {productName: SQL Managed Instance Business Critical - Compute Gen5, meterName: vCore}
          regex: {skuName: "^(?P<vcpu>\\d+) vCore$"}
      - kind: storage
        basis: gb_month
        matcher:
          source: SQL Managed Instance
          equals: {productName: SQL Managed Instance General Purpose - Storage}
          regex: {meterName: "Data Stored$"}
          exclude: {meterName: [Zone]}
      - kind: backup
        basis: gb_month
        free_fraction_of_storage: 1.0
        matcher:
          source: SQL Managed Instance
          equals: {productName: SQL Managed Instance PITR Backup Storage, meterName: LRS Data Stored}
    note: "vCore model, SQL licence included; first 32 GB of storage is included in the vCore price."
  azure.cosmos_db_mongodb_ru: &cosmos
    multi_az_rate: included
    components:
      - kind: throughput
        basis: ru100_hour
        matcher:
          source: Azure Cosmos DB
          equals: {productName: Azure Cosmos DB, meterName: 100 RU/s}
      - kind: storage
        basis: gb_month
        matcher:
          source: Azure Cosmos DB
          equals: {productName: Azure Cosmos DB, meterName: Data Stored}
          exclude: {skuName: [Free Tier, mRUs]}
    note: "Provisioned throughput (manual), single write region; each extra region adds the same RU/s and storage."
  azure.cosmos_db_cassandra: *cosmos
  azure.vm_self_managed:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: instance_hour
        matcher:
          source: Virtual Machines
          odata: "contains(armSkuName, 'ds_v5') or contains(armSkuName, 'ms_v2')"
          regex: {productName: "^Virtual Machines \\S+ Series$"}
          exclude: {skuName: [Spot, Low Priority]}
          dims: {instance: armSkuName}
      - kind: storage
        basis: gb_hour
        applies_to_storage: [premium_ssd_v2]
        matcher:
          source: Storage
          odata: "productName eq 'Azure Premium SSD v2'"
          equals: {productName: Azure Premium SSD v2, meterName: Premium LRS Provisioned Capacity}
    note: "Linux VM and Premium SSD v2 capacity only; database licences, extra disk IOPS/throughput and DBA effort are not included."

  # ---------------- GCP (Cloud Billing Catalog; built with a service account or API key) ----------------
  gcp.cloudsql_postgresql:
    multi_az_rate: deployment_option
    components:
      - kind: compute
        basis: vcpu_hour
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for PostgreSQL: (?P<deployment>Zonal|Regional) - vCPU in "}
          aliases: {deployment: {zonal: single-az, regional: multi-az}}
      - kind: memory
        basis: memory_gb_hour
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for PostgreSQL: (?P<deployment>Zonal|Regional) - RAM in "}
          aliases: {deployment: {zonal: single-az, regional: multi-az}}
      - kind: storage
        basis: gb_month
        applies_to_storage: [pd_ssd]
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for PostgreSQL: (?P<deployment>Zonal|Regional) - Standard storage in "}
          aliases: {deployment: {zonal: single-az, regional: multi-az}}
      - kind: backup
        basis: gb_month
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for PostgreSQL: Backups in "}
    note: "Enterprise edition rates; Enterprise Plus (needed above 99.95% availability) is priced higher and not modelled. Regional (HA) rates include the standby."
  gcp.cloudsql_mysql:
    multi_az_rate: deployment_option
    components:
      - kind: compute
        basis: vcpu_hour
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for MySQL: (?P<deployment>Zonal|Regional) - vCPU in "}
          aliases: {deployment: {zonal: single-az, regional: multi-az}}
      - kind: memory
        basis: memory_gb_hour
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for MySQL: (?P<deployment>Zonal|Regional) - RAM in "}
          aliases: {deployment: {zonal: single-az, regional: multi-az}}
      - kind: storage
        basis: gb_month
        applies_to_storage: [pd_ssd]
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for MySQL: (?P<deployment>Zonal|Regional) - Standard storage in "}
          aliases: {deployment: {zonal: single-az, regional: multi-az}}
      - kind: storage
        basis: gb_month
        applies_to_storage: [hyperdisk_balanced]
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for MySQL: (?P<deployment>Zonal|Regional) - Enterprise Storage Hyperdisk Balanced Capacity in "}
          aliases: {deployment: {zonal: single-az, regional: multi-az}}
      - kind: backup
        basis: gb_month
        matcher:
          source: Cloud SQL
          regex: {description: "^Cloud SQL for MySQL: Backups in "}
    note: "Enterprise edition rates; Enterprise Plus (needed above 99.95% availability) is priced higher and not modelled. Regional (HA) rates include the standby."
  gcp.alloydb:
    multi_az_rate: extra_node
    components:
      - kind: compute
        basis: vcpu_hour
        matcher:
          source: AlloyDB
          regex: {description: "^AlloyDB Instance vCPU Cores in "}
      - kind: memory
        basis: memory_gb_hour
        matcher:
          source: AlloyDB
          regex: {description: "^AlloyDB Instance RAM Usage in "}
      - kind: storage
        basis: gb_hour
        matcher:
          source: AlloyDB
          regex: {description: "^AlloyDB Cluster Database Storage in "}
    note: "HA primary billed as two nodes; read pool nodes billed each; cluster storage shared."
  gcp.compute_engine_self_managed:
    multi_az_rate: extra_node
    components:
      - {kind: compute, basis: vcpu_hour, applies_to_family: [n2], matcher: {source: Compute Engine, regex: {description: "^N2 Instance Core running in "}}}
      - {kind: compute, basis: vcpu_hour, applies_to_family: [n4], matcher: {source: Compute Engine, regex: {description: "^N4 Instance Core running in "}}}
      - {kind: compute, basis: vcpu_hour, applies_to_family: [c4], matcher: {source: Compute Engine, regex: {description: "^C4 Instance Core running in "}}}
      - {kind: compute, basis: vcpu_hour, applies_to_family: [m3], matcher: {source: Compute Engine, regex: {description: "^M3 Memory-optimized Instance Core running in "}}}
      - {kind: memory, basis: memory_gb_hour, applies_to_family: [n2], matcher: {source: Compute Engine, regex: {description: "^N2 Instance Ram running in "}}}
      - {kind: memory, basis: memory_gb_hour, applies_to_family: [n4], matcher: {source: Compute Engine, regex: {description: "^N4 Instance Ram running in "}}}
      - {kind: memory, basis: memory_gb_hour, applies_to_family: [c4], matcher: {source: Compute Engine, regex: {description: "^C4 Instance Ram running in "}}}
      - {kind: memory, basis: memory_gb_hour, applies_to_family: [m3], matcher: {source: Compute Engine, regex: {description: "^M3 Memory-optimized Instance Ram running in "}}}
      - {kind: storage, basis: gb_month, applies_to_storage: [hyperdisk_balanced], matcher: {source: Compute Engine, regex: {description: "^Hyperdisk Balanced Capacity in "}}}
      - {kind: storage, basis: gb_month, applies_to_storage: [hyperdisk_extreme], matcher: {source: Compute Engine, regex: {description: "^Hyperdisk Extreme Capacity in "}}}
      - {kind: storage, basis: gb_month, applies_to_storage: [pd_ssd], matcher: {source: Compute Engine, regex: {description: "^SSD backed PD Capacity( in |$)"}}}
    note: "VM cores, RAM and disk capacity only; database licences, extra disk IOPS/throughput and DBA effort are not included."

